# ESP32-S3 with PSRAM. Adapt the I2S pins in native-full-duplex.yaml to your board.
# Enable the optional directory/mailbox services in coordinated HA VoIP Stack.
substitutions:
  voip_stack_source: github://n-IA-hane/esphome-voip-stack@dev
packages:
  native_audio: !include native-full-duplex.yaml
psram:
  mode: octal
  speed: 80MHz
external_components:
  - source: ${voip_stack_source}
    components: [ldap_directory, phone_client]
voip_stack:
  signaling_buffers_in_psram: true
  ha_integration:
    auto_register: true
  registration:
    message_waiting: true
  blf:
    max_subscriptions: 16
    presence: true
    buffers_in_psram: true
ldap_directory:
  id: directory
  voip_stack_id: phone
  account_id: ha
  managed_by_ha: true
  task_stack_in_psram: true
button:
  - platform: template
    name: Open mailbox
    on_press:
      - voip_stack.call_mailbox:
          id: phone
