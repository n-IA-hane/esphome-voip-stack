name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.2"

      - name: Install test dependencies
        run: >-
          python -m pip install
          esphome==2026.9.0
          pytest==9.1.1
          ruff==0.15.21

      - name: Run static checks
        run: >-
          python -m ruff check
          esphome/components
          tests

      - name: Fetch the firmware's audio resampler for native DSP tests
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: esphome-libs/esp-audio-libs
          ref: 3079cd0576d563c955e412937a91782ab4eaf516 # 3.2.1
          path: .test-deps/esp-audio-libs

      - name: Run contract tests
        env:
          ESP_AUDIO_LIBS_SOURCE: ${{ github.workspace }}/.test-deps/esp-audio-libs
        run: python -m pytest -q
