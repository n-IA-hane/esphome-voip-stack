name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: >-
          python -m pip install
          esphome==2026.7.2
          pytest==9.1.1
          ruff==0.15.21

      - name: Run static checks
        run: >-
          python -m ruff check
          esphome/components/voip_stack
          esphome/components/ring_buffer
          tests

      - name: Run contract tests
        run: python -m pytest -q
