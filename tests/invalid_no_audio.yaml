esphome:
  name: voip-invalid-no-audio

esp32:
  board: freenove_esp32_s3_wroom
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source: ../esphome/components
    components: [voip_stack]

logger:

voip_stack:
  id: phone
  audio:
    codecs:
      - codec: pcm
        tx: [{sample_rate: 16000, frame_ms: 20}]
