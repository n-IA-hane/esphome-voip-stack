# Compile the receive-only direction, including the shared SIP signal handler.
esphome:
  name: voip-minimal-speaker
  min_version: 2026.10.0
esp32:
  board: freenove_esp32_s3_wroom
  variant: esp32s3
  framework:
    type: esp-idf
external_components:
  - source: ../esphome/components
    components: [voip_stack]
logger:
wifi:
  ssid: test-network
  password: test-password
i2s_audio:
  - id: tx_i2s
    i2s_bclk_pin: GPIO9
    i2s_lrclk_pin: GPIO10
speaker:
  - platform: i2s_audio
    id: spk_main
    dac_type: external
    i2s_audio_id: tx_i2s
    i2s_dout_pin: GPIO11
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
voip_stack:
  id: phone
  speaker: spk_main
  audio:
    tx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
    rx:
      sample_rate: 48000
      pcm_format: s16le
      channels: 1
      frame_ms: 10
